<section>
    <div class="container mx-auto py-216 px-4">
        <form class="relative font-[Montserrat] text-[16px] font-medium text-black">
  <!-- 1. Are you a Non-Profit? -->
  <div class="absolute left-[74px] top-[0px] inline-flex flex-col gap-4 w-[201px]">
    <label for="nonProfit">Are you a Non-Profit?</label>
    <select id="nonProfit" name="nonProfit" class="h-[34px] w-full px-4 bg-white border border-black rounded-[10px] shadow-md appearance-none">
      <option value="">Select Option</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </div>

  <!-- 2. Technology or Service -->
  <div class="absolute left-[470px] top-[100px] inline-flex flex-col gap-[9px] w-[672px]">
    <label for="technology">Technology Or Service</label>
    <select id="technology" name="technology" class="px-4 py-2 bg-white border border-black rounded-[10px] shadow-md">
      <option value="">Select Option</option>
      <option value="Salesforce">Salesforce – CRM and cloud solutions tailored for business success.</option>
      <option value="AWS">AWS – Scalable and secure cloud computing services.</option>
      <option value="Microsoft">Microsoft – Azure-powered enterprise cloud solutions.</option>
      <option value="Google Cloud">Google Cloud – AI-driven and data-centric cloud innovations.</option>
      <option value="SAP">SAP – Intelligent cloud solutions for business transformation.</option>
      <option value="Oracle">Oracle – Cloud infrastructure and enterprise applications.</option>
      <option value="Cloud Security & Compliance">☁️ Cloud Security & Compliance – Protect operations with robust security and regulatory compliance.</option>
      <option value="Enterprise Cloud Integration">☁️ Enterprise Cloud Integration – Unify on-premises and cloud systems for smooth operations.</option>
      <option value="Cloud Migration">☁️ Cloud Migration – Confidently move data, applications, and services.</option>
      <option value="Managed Services">☁️ Managed Services – Ensure continuous cloud monitoring and support.</option>
      <option value="Industry-Specific Solutions">☁️ Industry-Specific Solutions – Tailored cloud innovations for unique business needs.</option>
      <option value="Naleko Corporate Training">Naleko Corporate Training – We tailor our solutions to the unique needs of each client. From systems integration to team enablement, our training programs help businesses get the most from their cloud investments.</option>
      <option value="Naleko Academy">Naleko Academy – More than a learning platform, the Naleko Academy is a thriving community where emerging tech talent is nurtured. We focus on practical skills, mentorship, and innovation-driven learning.</option>
      <option value="Naleko Girls in Tech">Naleko Girls in Tech – We are committed to closing the gender gap in tech. By supporting and empowering young women, we aim to build a more inclusive, diverse, and dynamic technology industry for all.</option>
    </select>
  </div>

  <!-- 3. Where did you get this link? -->
  <div class="absolute left-[74px] top-[100px] inline-flex flex-col gap-4 w-[297px]">
    <label for="source">Where did you get this Link?</label>
    <select id="source" name="source" class="px-4 py-[6px] bg-white border border-black rounded-[10px] shadow-md">
      <option value="">Select Option</option>
      <option value="Website">Website</option>
      <option value="Naleko Email">Naleko Email</option>
      <option value="LinkedIn">LinkedIn</option>
      <option value="Event">Event</option>
      <option value="Facebook">Facebook</option>
      <option value="AWM">AWM</option>
      <option value="Exhibition">Exhibition</option>
    </select>
  </div>

  <!-- 4. City -->
  <div class="absolute left-[844px] top-[200px] inline-flex flex-col gap-4 w-[297px]">
    <label for="city">City</label>
    <select id="city" name="city" class="h-[34px] px-4 bg-white border border-black rounded-[10px] shadow-md">
      <option value="">Select Option</option>
      <option value="Johannesburg">Johannesburg</option>
      <option value="Cape Town">Cape Town</option>
      <option value="Durban">Durban</option>
      <option value="Pretoria">Pretoria</option>
      <option value="Port Elizabeth">Port Elizabeth</option>
      <!-- Add more cities as needed -->
    </select>
  </div>

  <!-- 5. First Name -->
  <div class="absolute left-[470px] top-[0px] inline-flex flex-col gap-4 w-[201px]">
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" name="firstName" class="h-[34px] px-4 bg-white border border-black rounded-[10px] shadow-md" />
  </div>

  <!-- 6. Last Name -->
  <div class="absolute left-[901px] top-[0px] inline-flex flex-col gap-4 w-[241px]">
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" name="lastName" class="h-[34px] px-4 bg-white border border-black rounded-[10px] shadow-md" />
  </div>

  <!-- 7. Phone -->
  <div class="absolute left-[74px] top-[200px] inline-flex flex-col gap-4 w-[241px]">
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" class="h-[34px] px-4 bg-white border border-black rounded-[10px] shadow-md" placeholder="e.g. 082 123 4567" />
  </div>

  <!-- 8. Email -->
  <div class="absolute left-[470px] top-[200px] inline-flex flex-col gap-4 w-[241px]">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" class="h-[34px] px-4 bg-white border border-black rounded-[10px] shadow-md" placeholder="you@example.com" />
  </div>

  <!-- 9. Comments -->
  <div class="absolute left-[74px] top-[300px] inline-flex flex-col gap-4 w-[679px]">
    <label for="comments">Comments</label>
    <textarea id="comments" name="comments" rows="6" class="h-[169px] px-4 py-2 bg-white border border-black rounded-[10px] shadow-md" placeholder="Add your message or notes here..."></textarea>
  </div>

  <div class="absolute top-[400px] left-[875px]">
  <button class="w-[204px] h-[44px] bg-[#120C4E] rounded-[10px] shadow-[4px_4px_4px_rgba(0,0,0,0.25)] text-white text-base font-semibold font-['Montserrat']">
    Send Message
  </button>
</div>

</form>
